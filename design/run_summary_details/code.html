<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FitBox - Run Summary</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,700;0,800;1,700;1,800&amp;family=Inter:wght@400&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-container": "#474649",
                        "on-tertiary": "#00391e",
                        "surface-container-highest": "#323538",
                        "secondary-fixed-dim": "#c8c6c8",
                        "error-container": "#93000a",
                        "secondary": "#c8c6c8",
                        "on-secondary": "#303032",
                        "primary": "#ffb4ab",
                        "outline": "#ae8883",
                        "surface-container-lowest": "#0b0f11",
                        "on-secondary-container": "#b6b4b7",
                        "inverse-on-surface": "#2d3134",
                        "on-background": "#e0e2e6",
                        "tertiary": "#62dd96",
                        "inverse-primary": "#c00014",
                        "on-secondary-fixed-variant": "#474649",
                        "on-error-container": "#ffdad6",
                        "on-primary": "#690006",
                        "primary-container": "#e31e24",
                        "surface-tint": "#ffb4ab",
                        "primary-fixed": "#ffdad6",
                        "surface-variant": "#323538",
                        "background": "#101417",
                        "tertiary-fixed": "#80fab0",
                        "outline-variant": "#5d3f3c",
                        "on-surface": "#e0e2e6",
                        "tertiary-fixed-dim": "#62dd96",
                        "tertiary-container": "#00854e",
                        "surface-dim": "#101417",
                        "surface-bright": "#363a3d",
                        "error": "#ffb4ab",
                        "surface": "#101417",
                        "on-primary-container": "#fffafa",
                        "on-tertiary-container": "#f0fff1",
                        "surface-container": "#1d2023",
                        "on-secondary-fixed": "#1b1b1d",
                        "on-surface-variant": "#e7bdb8",
                        "surface-container-high": "#272a2d",
                        "on-primary-fixed": "#410002",
                        "surface-container-low": "#191c1f",
                        "inverse-surface": "#e0e2e6",
                        "secondary-fixed": "#e4e2e4",
                        "on-error": "#690005",
                        "primary-fixed-dim": "#ffb4ab",
                        "on-tertiary-fixed-variant": "#00522e",
                        "on-tertiary-fixed": "#00210f",
                        "on-primary-fixed-variant": "#93000d"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px",
                        "2xl": "1.5rem"
                    },
                    "spacing": {
                        "stack-sm": "8px",
                        "gutter": "16px",
                        "stack-lg": "32px",
                        "stack-md": "16px",
                        "unit": "8px",
                        "container-padding": "24px"
                    },
                    "fontFamily": {
                        "data-lg": ["Plus Jakarta Sans"],
                        "headline-lg": ["Hanken Grotesk"],
                        "label-caps": ["Plus Jakarta Sans"],
                        "display-italic": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "data-lg": ["42px", { "lineHeight": "42px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.08em", "fontWeight": "600" }],
                        "display-italic": ["48px", { "lineHeight": "52px", "letterSpacing": "-0.04em", "fontWeight": "800" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "34px", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .glass-panel {
            background-color: rgba(46, 46, 48, 0.7);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.15);
        }
        .btn-primary-glow {
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.3), 0 4px 12px rgba(227, 30, 36, 0.4);
        }
        .text-glow {
            text-shadow: 0 0 10px rgba(255, 180, 171, 0.5);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md antialiased pb-32">
<!-- TopAppBar -->
<header class="sticky top-0 w-full z-50 px-container-padding py-stack-md flex justify-between items-end bg-surface/70 backdrop-blur-xl dark:bg-surface/70 border-b border-white/20 shadow-[0px_10px_30px_rgba(0,0,0,0.15)]">
<button class="text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">menu</span>
</button>
<h1 class="font-display-italic text-display-italic text-primary dark:text-primary italic">Dashboard</h1>
<button class="text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">notifications</span>
</button>
</header>
<main class="px-container-padding mt-stack-md flex flex-col gap-stack-lg">
<!-- Map Canvas -->
<section class="w-full h-[300px] rounded-2xl glass-panel overflow-hidden relative">
<img class="w-full h-full object-cover opacity-80 mix-blend-screen" data-alt="A high-contrast, dark mode satellite map view of a city park with a vibrant red, glowing GPS running route tracing a complex loop. The map has a premium, instrument-like aesthetic with subtle dark greys and deep blacks." data-location="New York City" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCY3JXGt7bcETYvmhOBl9hfGSfzG-Yd9o5-m_TVcIcQf6oYZu3bqmWA7QjOCjjjuxCfNPo_Sr7te45bfwwJS-54a85567CjGsQKAEtVvqqe-YbsNku--5S_niWK7aLEr5cM0Dkn4NRA7o9vlUBbsoadWq-EB2ec_rainhl6_cwyxCfBSY3Q70b5FwWEB1_NKaCnpeMYiWkVBUBErje1Fnr4NtiTMMWxb6Q8GuO-Qegcrzj5ZrttCQhG"/>
<!-- Floating Data overlay on map -->
<div class="absolute bottom-4 left-4 right-4 flex justify-between items-end">
<div class="bg-surface-container/90 backdrop-blur-md rounded-full px-4 py-2 border border-white/10">
<span class="font-label-caps text-label-caps text-on-surface uppercase">Central Park Loop</span>
</div>
<div class="bg-primary/20 backdrop-blur-md rounded-full w-10 h-10 flex items-center justify-center border border-primary/50">
<span class="material-symbols-outlined text-primary">my_location</span>
</div>
</div>
</section>
<!-- Celebratory Banner -->
<section class="glass-panel rounded-xl flex items-center gap-gutter p-4 relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-r from-primary-container/20 to-transparent pointer-events-none"></div>
<div class="absolute left-0 top-0 bottom-0 w-1 bg-primary"></div>
<div class="w-12 h-12 rounded-full bg-primary/20 flex items-center justify-center border border-primary/30">
<span class="material-symbols-outlined text-primary text-glow" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
</div>
<div>
<p class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest mb-1">New Personal Best</p>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile italic text-primary text-glow">+150 pts earned</h2>
</div>
</section>
<!-- Headline Stats Bento Grid -->
<section class="grid grid-cols-2 gap-stack-sm">
<!-- Distance -->
<div class="glass-panel rounded-2xl p-4 flex flex-col justify-between aspect-square">
<div class="flex justify-between items-start w-full">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Distance</span>
<span class="material-symbols-outlined text-on-surface/50 text-sm">straighten</span>
</div>
<div>
<div class="font-display-italic text-[40px] leading-[40px] font-extrabold italic text-on-surface tracking-tighter">5.24</div>
<div class="font-label-caps text-label-caps text-primary uppercase mt-1">Kilometers</div>
</div>
</div>
<!-- Avg Pace -->
<div class="glass-panel rounded-2xl p-4 flex flex-col justify-between aspect-square">
<div class="flex justify-between items-start w-full">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Avg Pace</span>
<span class="material-symbols-outlined text-on-surface/50 text-sm">timer</span>
</div>
<div>
<div class="font-display-italic text-[40px] leading-[40px] font-extrabold italic text-on-surface tracking-tighter">5:23</div>
<div class="font-label-caps text-label-caps text-on-surface-variant uppercase mt-1">/ km</div>
</div>
</div>
<!-- Time -->
<div class="glass-panel rounded-2xl p-4 flex flex-col justify-between aspect-[2/1] col-span-2">
<div class="flex justify-between items-start w-full">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Duration</span>
<span class="material-symbols-outlined text-on-surface/50 text-sm">schedule</span>
</div>
<div class="flex items-baseline gap-2">
<span class="font-data-lg text-data-lg text-on-surface">28</span>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">m</span>
<span class="font-data-lg text-data-lg text-on-surface">15</span>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">s</span>
</div>
</div>
</section>
<!-- Pace Splits Chart -->
<section class="glass-panel rounded-2xl p-container-padding flex flex-col gap-stack-md">
<h3 class="font-headline-lg-mobile text-[22px] italic text-on-surface">Pace Splits</h3>
<div class="flex items-end h-[120px] gap-2 mt-4">
<!-- Bar 1 -->
<div class="flex-1 flex flex-col items-center gap-2 group">
<div class="w-full bg-primary/20 rounded-t-sm relative h-full flex items-end">
<div class="w-full bg-primary rounded-t-sm h-[80%] transition-all group-hover:bg-primary/80"></div>
</div>
<span class="font-label-caps text-[10px] text-on-surface-variant">1</span>
</div>
<!-- Bar 2 -->
<div class="flex-1 flex flex-col items-center gap-2 group">
<div class="w-full bg-primary/20 rounded-t-sm relative h-full flex items-end">
<div class="w-full bg-primary rounded-t-sm h-[65%] transition-all group-hover:bg-primary/80"></div>
</div>
<span class="font-label-caps text-[10px] text-on-surface-variant">2</span>
</div>
<!-- Bar 3 -->
<div class="flex-1 flex flex-col items-center gap-2 group">
<div class="w-full bg-primary/20 rounded-t-sm relative h-full flex items-end">
<div class="w-full bg-primary rounded-t-sm h-[90%] transition-all group-hover:bg-primary/80"></div>
</div>
<span class="font-label-caps text-[10px] text-on-surface-variant">3</span>
</div>
<!-- Bar 4 -->
<div class="flex-1 flex flex-col items-center gap-2 group">
<div class="w-full bg-primary/20 rounded-t-sm relative h-full flex items-end">
<div class="w-full bg-primary rounded-t-sm h-[75%] transition-all group-hover:bg-primary/80"></div>
</div>
<span class="font-label-caps text-[10px] text-on-surface-variant">4</span>
</div>
<!-- Bar 5 -->
<div class="flex-1 flex flex-col items-center gap-2 group">
<div class="w-full bg-primary/20 rounded-t-sm relative h-full flex items-end">
<div class="w-full bg-primary rounded-t-sm h-[85%] transition-all group-hover:bg-primary/80"></div>
</div>
<span class="font-label-caps text-[10px] text-on-surface-variant">5</span>
</div>
</div>
<div class="flex justify-between w-full border-t border-white/10 pt-2 mt-2">
<span class="font-label-caps text-[10px] text-on-surface-variant">Fastest: 4:50</span>
<span class="font-label-caps text-[10px] text-on-surface-variant">Slowest: 6:10</span>
</div>
</section>
<!-- Actions -->
<section class="flex gap-gutter mt-stack-sm mb-stack-lg">
<button class="flex-1 glass-panel rounded-full py-4 flex items-center justify-center gap-2 hover:bg-surface-container-high transition-colors active:scale-95">
<span class="material-symbols-outlined text-on-surface" style="font-variation-settings: 'FILL' 0;">bookmark</span>
<span class="font-label-caps text-label-caps text-on-surface uppercase">Save Run</span>
</button>
<button class="flex-1 bg-primary text-on-primary rounded-full py-4 flex items-center justify-center gap-2 btn-primary-glow hover:opacity-90 transition-opacity active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">ios_share</span>
<span class="font-label-caps text-label-caps uppercase">Share</span>
</button>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-8 left-1/2 -translate-x-1/2 w-[90%] max-w-md z-50 flex justify-around items-center h-16 px-6 bg-secondary-container/70 backdrop-blur-xl dark:bg-secondary-container/70 border border-white/20 shadow-[0px_10px_30px_rgba(0,0,0,0.15)] rounded-full">
<button class="flex flex-col items-center justify-center w-12 h-12 text-on-surface/60 hover:text-primary/80 transition-colors">
<span class="material-symbols-outlined text-[24px]">home</span>
</button>
<button class="flex flex-col items-center justify-center w-12 h-12 text-on-surface/60 hover:text-primary/80 transition-colors">
<span class="material-symbols-outlined text-[24px]">map</span>
</button>
<button class="flex flex-col items-center justify-center w-12 h-12 text-primary scale-110 active:scale-90 transition-all duration-200 ease-[cubic-bezier(0.34,1.56,0.64,1)] relative">
<div class="absolute inset-0 bg-primary/20 rounded-full blur-md"></div>
<span class="material-symbols-outlined text-[24px] relative z-10" style="font-variation-settings: 'FILL' 1;">directions_run</span>
</button>
<button class="flex flex-col items-center justify-center w-12 h-12 text-on-surface/60 hover:text-primary/80 transition-colors">
<span class="material-symbols-outlined text-[24px]">account_balance_wallet</span>
</button>
<button class="flex flex-col items-center justify-center w-12 h-12 text-on-surface/60 hover:text-primary/80 transition-colors">
<span class="material-symbols-outlined text-[24px]">person</span>
</button>
</nav>
</body></html>
