<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",

                extend: {

                        "secondary-container": "#474649",
                        "on-tertiary": "#00391e",

                        "secondary-fixed-dim": "#c8c6c8",

                        "secondary": "#c8c6c8",
                        "on-secondary": "#303032",
                        "primary": "#ffb4ab",
                        "outline": "#ae8883",
                        "surface-container-lowest": "#0b0f11",
                        "on-secondary-container": "#b6b4b7",
                        "inverse-on-surface": "#2d3134",
                        "on-background": "#e0e2e6",
                        "tertiary": "#62dd96",
                        "inverse-primary": "#c00014",
                        "on-secondary-fixed-variant": "#474649",
                        "on-error-container": "#ffdad6",
                        "on-primary": "#690006",
                        "primary-container": "#e31e24",
                        "surface-tint": "#ffb4ab",
                        "primary-fixed": "#ffdad6",
                        "surface-variant": "#323538",

                        "surface-container": "#1d2023",
                        "on-secondary-fixed": "#1b1b1d",
                        "on-surface-variant": "#e7bdb8",
                        "surface-container-high": "#272a2d",
                        "on-primary-fixed": "#410002",
                        "surface-container-low": "#191c1f",
                        "inverse-surface": "#e0e2e6",
                        "secondary-fixed": "#e4e2e4",
                        "on-error": "#690005",
                        "primary-fixed-dim": "#ffb4ab",
                        "on-tertiary-fixed-variant": "#00522e",
                        "on-tertiary-fixed": "#00210f",
                        "on-primary-fixed-variant": "#93000d"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-sm": "8px",
                        "gutter": "16px",
                        "stack-lg": "32px",
                        "stack-md": "16px",
                        "unit": "8px",
                        "container-padding": "24px"
                    },
                    "fontFamily": {
                        "data-lg": ["Plus Jakarta Sans"],
                        "headline-lg": ["Hanken Grotesk"],
                        "label-caps": ["Plus Jakarta Sans"],
                        "display-italic": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "data-lg": ["42px", { "lineHeight": "42px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.08em", "fontWeight": "600" }],
                        "display-italic": ["48px", { "lineHeight": "52px", "letterSpacing": "-0.04em", "fontWeight": "800" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "34px", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .glow-effect {
            background: radial-gradient(circle at bottom right, rgba(227, 30, 36, 0.4) 0%, transparent 60%);
        }
        
        .loading-bar-animation {
            width: 50%;
            transition: width 0.5s ease-in-out;
        }

        /* Subtle pulse for the badge */
        @keyframes subtle-pulse {
            0% { transform: scale(1); box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.15); }
            50% { transform: scale(1.02); box-shadow: 0px 15px 40px rgba(0, 0, 0, 0.25); }
            100% { transform: scale(1); box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.15); }
        }
        .animate-subtle-pulse {
            animation: subtle-pulse 3s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-background min-h-screen flex items-center justify-center relative overflow-hidden antialiased">
<!-- Background Gradient & Glow -->
<div class="absolute inset-0 bg-gradient-to-br from-[#1A1B21] to-[#0A0B0E] z-0"></div>
<div class="absolute inset-0 glow-effect z-10 pointer-events-none"></div>
<!-- Main Content Container -->
<main class="relative z-20 flex flex-col items-center justify-center w-full max-w-sm px-container-padding">
<!-- Logo Badge -->
<div class="bg-white rounded-xl p-6 shadow-[0px_10px_30px_rgba(0,0,0,0.15)] animate-subtle-pulse flex items-center justify-center mb-12">
<img alt="FitBox Logo" class="w-32 h-32 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAYQ-AvCeYs_7sMhrh_dHGWNfZyCYEjFO5deZN0l7iNWcDLBKwtoo1Bm4TSJ5IYsd21j3aGj8ijE3BqDGEjca4sU0GvALt6OZu5bs055XWplkLWS5urQiBdOjv69xI3Sbf5ew6U5JLTKU5CJSnAIuKp_9NW4z8L5ntkDFpl7kwki69XWLcDEIYIqOsAt8QZDr73tOf9qMinbIMMMx5_IG3lDo182z58cnCS3gQK53vt4spLnIuOLYHi"/>
</div>
<!-- Loading Indicator -->
<div class="w-48 h-1 bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-primary-container loading-bar-animation rounded-full"></div>
</div>
</main>
<script>
        // Simulate a simple loading progression for the aesthetic
        document.addEventListener('DOMContentLoaded', () => {
            const loadingBar = document.querySelector('.loading-bar-animation');
            if(loadingBar) {
                setTimeout(() => {
                    loadingBar.style.width = '75%';
                }, 1000);
                setTimeout(() => {
                    loadingBar.style.width = '90%';
                }, 2500);
            }
        });
    </script>
</body></html>
