<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        
        .glass-card {
            background: rgba(46, 46, 48, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-bottom-color: transparent;
            border-right-color: transparent;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.15);
        }
        
        .glass-input {
            background: rgba(46, 46, 48, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        
        .glass-input:focus {
            border-color: theme('colors.primary-container');
            box-shadow: 0 0 10px rgba(227, 30, 36, 0.2);
            outline: none;
        }

        .btn-primary {
            background: linear-gradient(180deg, theme('colors.primary-container') 0%, #a01519 100%);
            box-shadow: inset 0px 1px 0px rgba(255, 255, 255, 0.3);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .btn-primary:active {
            transform: scale(0.95);
        }

        .btn-secondary {
            background: rgba(46, 46, 48, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-bottom-color: transparent;
            border-right-color: transparent;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .btn-secondary:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-container-padding relative overflow-hidden">
<!-- Background Texture -->
<div class="absolute inset-0 z-0 bg-cover bg-center opacity-30 mix-blend-overlay" data-alt="A dark, moody abstract background with very subtle, out-of-focus deep red and charcoal grey glowing geometric shapes. The lighting suggests a high-end, premium fitness studio atmosphere with a sleek, modern kinetic aesthetic. The overall tone is dark, quiet luxury, with minimal visual noise." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuD3hvMCjt3eGYM_ug2FwUQ-B6TVX3IGI9Y9KOkrkoJyAIrUyJYyw5NEDmvuRswCz3OCurmEzCJqkIWLzKVZCVFmpyyKHymKq65BE31Tx3Xrcb-D03FsV4RaeAC1OcKEuosF_JEDPXSgdPC-Vp0wN5w1TcrLhK_ouMvJqwD3FJj5xROAsHrAlshudS6T5jDfycPHF-TIER0VeH409jWDCysw4k2-VKu6psPaD9qinoJl_2fQ46Zm93F3')"></div>
<div class="w-full max-w-md z-10 flex flex-col gap-stack-lg">
<!-- Logo Header -->
<div class="flex flex-col items-center gap-stack-sm text-center">
<div class="w-16 h-16 rounded-full glass-card flex items-center justify-center mb-unit">
<span class="material-symbols-outlined text-primary-container" style="font-size: 32px;">fitness_center</span>
</div>
<h1 class="font-display-italic text-display-italic text-on-surface italic tracking-tighter">FITBOX</h1>
<p class="font-label-caps text-label-caps text-on-surface-variant opacity-80">PERFORMANCE TERRITORY</p>
</div>
<!-- Main Form Card -->
<div class="glass-card rounded-[24px] p-container-padding w-full flex flex-col gap-stack-md">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface md:font-headline-lg md:text-headline-lg pb-unit">Create Account</h2>
<form class="flex flex-col gap-gutter">
<!-- Full Name -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant pl-unit" for="fullName">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant opacity-50">person</span>
<input class="glass-input w-full rounded-full py-3 pl-12 pr-4 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/30 focus:ring-0" id="fullName" placeholder="John Doe" type="text"/>
</div>
</div>
<!-- Email -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant pl-unit" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant opacity-50">mail</span>
<input class="glass-input w-full rounded-full py-3 pl-12 pr-4 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/30 focus:ring-0" id="email" placeholder="john@example.com" type="email"/>
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant pl-unit" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant opacity-50">lock</span>
<input class="glass-input w-full rounded-full py-3 pl-12 pr-12 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/30 focus:ring-0" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant opacity-50 hover:text-on-surface hover:opacity-100 transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Primary Button -->
<button class="btn-primary w-full rounded-full py-4 mt-stack-sm flex items-center justify-center gap-unit" type="button">
<span class="font-body-md text-body-md font-semibold text-on-primary-container">Send verification code</span>
<span class="material-symbols-outlined text-on-primary-container" style="font-size: 20px;">arrow_forward</span>
</button>
</form>
<div class="flex items-center gap-unit py-unit">
<div class="flex-1 h-px bg-white/10"></div>
<span class="font-label-caps text-label-caps text-on-surface-variant">OR</span>
<div class="flex-1 h-px bg-white/10"></div>
</div>
<!-- Social Sign Up -->
<button class="btn-secondary w-full rounded-full py-3 flex items-center justify-center gap-gutter" type="button">
<span class="font-body-md text-body-md text-on-surface">Sign up with Google</span>
</button>
</div>
<!-- Login Link -->
<div class="text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                Already have an account? 
                <a class="text-primary hover:text-primary-container transition-colors font-semibold" href="#">Log in</a>
</p>
</div>
</div>
</body></html>
