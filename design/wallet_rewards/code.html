<!-- Interactions Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Count-up animation for balance
            const counterEl = document.getElementById('balance-counter');
            const target = 1250;
            const duration = 1500; // ms
            const frameRate = 1000 / 60;
            const totalFrames = Math.round(duration / frameRate);
            let frame = 0;

            const easeOutQuart = (x) => 1 - Math.pow(1 - x, 4);

            const animate = () => {
                frame++;
                const progress = frame / totalFrames;
                const currentVal = Math.round(target * easeOutQuart(progress));
                
                // Format with commas
                counterEl.innerText = currentVal.toLocaleString('en-US');

                if (frame < totalFrames) {
                    requestAnimationFrame(animate);
                } else {
                    counterEl.innerText = '1,250';
                }
            };

            requestAnimationFrame(animate);
        });
    </script>
