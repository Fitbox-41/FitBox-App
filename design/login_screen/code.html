                    "spacing": {

                        "gutter": "16px",
                        "stack-lg": "32px",
                        "stack-md": "16px",
                        "unit": "8px",
                        "container-padding": "24px"
                    },
                    "fontFamily": {
                        "data-lg": ["Plus Jakarta Sans"],
                        "headline-lg": ["Hanken Grotesk"],
                        "label-caps": ["Plus Jakarta Sans"],

<style>
        .spring-animation {
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .spring-animation:active {
            transform: scale(0.95);
        }
    </style>

<body class="bg-background text-on-surface min-h-screen flex flex-col items-center justify-center relative overflow-hidden px-container-padding py-stack-lg font-body-md text-body-md">
<!-- Ambient Background Glow -->
<div class="absolute inset-0 z-0 pointer-events-none">
<div class="absolute top-1/4 left-1/4 w-[50vw] h-[50vw] bg-primary-container/20 rounded-full blur-[120px] mix-blend-screen transform -translate-x-1/2 -translate-y-1/2"></div>
<div class="absolute bottom-1/4 right-1/4 w-[40vw] h-[40vw] bg-primary-container/10 rounded-full blur-[100px] mix-blend-screen transform translate-x-1/2 translate-y-1/2"></div>
</div>
<!-- Main Content Container -->
<div class="relative z-10 w-full max-w-md flex flex-col items-center gap-stack-lg">
<!-- Logo Badge -->
<div class="w-32 h-32 flex items-center justify-center">
<img alt="FitBox Logo" class="w-full h-full object-contain filter drop-shadow-[0px_10px_30px_rgba(227,30,36,0.3)]" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAYQ-AvCeYs_7sMhrh_dHGWNfZyCYEjFO5deZN0l7iNWcDLBKwtoo1Bm4TSJ5IYsd21j3aGj8ijE3BqDGEjca4sU0GvALt6OZu5bs055XWplkLWS5urQiBdOjv69xI3Sbf5ew6U5JLTKU5CJSnAIuKp_9NW4z8L5ntkDFpl7kwki69XWLcDEIYIqOsAt8QZDr73tOf9qMinbIMMMx5_IG3lDo182z58cnCS3gQK53vt4spLnIuOLYHi"/>
</div>
<!-- Frosted Glass Login Card -->
<div class="w-full bg-[#2e2e30]/70 backdrop-blur-[20px] rounded-[24px] border border-white/20 border-r-white/5 border-b-white/5 p-stack-lg shadow-[0px_10px_30px_rgba(0,0,0,0.15)] flex flex-col gap-stack-md">
<div class="mb-stack-sm">
<h1 class="font-display-italic text-display-italic text-on-surface italic">Welcome back</h1>
<p class="text-on-surface-variant font-body-md text-body-md mt-unit">Enter your details to access your dashboard.</p>
</div>
<form class="flex flex-col gap-stack-md w-full">
<!-- Email Field -->
<div class="relative w-full group">
<div class="absolute inset-y-0 left-0 pl-gutter flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input class="w-full bg-[#2e2e30]/50 backdrop-blur-md text-on-surface placeholder-on-surface-variant rounded-full py-3 pl-[48px] pr-gutter border border-white/10 focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all duration-300" placeholder="Email" type="email"/>
</div>
<!-- Password Field -->
<div class="relative w-full group">
<div class="absolute inset-y-0 left-0 pl-gutter flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="w-full bg-[#2e2e30]/50 backdrop-blur-md text-on-surface placeholder-on-surface-variant rounded-full py-3 pl-[48px] pr-gutter border border-white/10 focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all duration-300" placeholder="Password" type="password"/>
</div>
<!-- Forgot Password -->
<div class="flex justify-end w-full">
<a class="text-primary hover:text-primary/80 transition-colors font-label-caps text-label-caps tracking-wider uppercase" href="#">Forgot password?</a>
</div>
<!-- Primary Login Button -->
<button class="w-full mt-stack-sm relative overflow-hidden rounded-full bg-primary-container text-on-primary-container py-4 font-label-caps text-label-caps tracking-wider uppercase spring-animation shadow-[0px_4px_20px_rgba(227,30,36,0.4)] group" type="submit">
<div class="absolute inset-x-0 top-0 h-1/2 bg-gradient-to-b from-white/20 to-transparent pointer-events-none"></div>
<span class="relative z-10 flex items-center justify-center gap-2">
                        Log in
                        <span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</span>
</button>
</form>
<!-- Divider -->
<div class="relative flex items-center py-stack-sm">
<div class="flex-grow border-t border-white/10"></div>
<span class="flex-shrink-0 mx-gutter text-on-surface-variant font-label-caps text-label-caps tracking-widest uppercase">or</span>
<div class="flex-grow border-t border-white/10"></div>
</div>
<!-- Google Button -->
<button class="w-full flex items-center justify-center gap-gutter py-4 bg-[#2e2e30]/50 backdrop-blur-md rounded-full border border-white/10 text-on-surface font-label-caps text-label-caps tracking-wider uppercase hover:bg-[#323538]/70 transition-colors spring-animation" type="button">
<img alt="Google" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDQJ6IhxCm5ol4yrsvuNs-Iruh8OLoREJ7_wWed2TCCpuhxh2OziHvWMXAelOr9HX4TLSUrpGwsmTj1rKx_y3mk5dtQSzEr-yG3s5r3QM2_-sBehu4j-_km7TMc4PxbM3LdF0ukThc1hY2q02KosAMsrd1UQveO-Mmq6a7F_-rolVdlhu7xh7abT-L-AdQ86DxFUhEo_B33EQQ8Lel8iQNOAU9UjhumBWISD6Fgrl6zjU65iC99m0u0"/>
                Continue with Google
            </button>
</div>
<!-- Sign Up Link -->
<p class="text-on-surface-variant font-body-md text-body-md text-center">
            Don't have an account? <a class="text-primary hover:text-primary/80 transition-colors font-bold ml-1" href="#">Sign up</a>
</p>
</div>
</body></html>
