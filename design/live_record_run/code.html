<style>
        /* Core visual language utilities */
        .glass-panel {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background-color: rgba(46, 46, 48, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            80% { transform: scale(2); opacity: 0; }
            100% { transform: scale(2); opacity: 0; }
        }
        
        .map-overlay {
            background: linear-gradient(to bottom, rgba(16, 20, 23, 0.8) 0%, rgba(16, 20, 23, 0) 20%, rgba(16, 20, 23, 0) 60%, rgba(16, 20, 23, 0.9) 100%);
        }
        
        .text-glow {
            text-shadow: 0 0 20px rgba(227, 30, 36, 0.4);
        }
    </style>

<body class="bg-background text-on-surface font-body-md antialiased overflow-hidden selection:bg-primary-container selection:text-white">
<!-- Full Screen Map Background -->
<div class="fixed inset-0 z-0 bg-surface-container-lowest">
<!-- Placeholder for actual map implementation -->
<img class="w-full h-full object-cover opacity-70" data-alt="A detailed, high-contrast dark mode city map visualization with a striking, glowing red route line weaving through stark black and charcoal grey streets. The map style is minimalist, precise, and tech-forward, resembling a premium fitness app interface. The route line is thick, vibrant, and features a subtle neon glow effect." data-location="New York City" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCAASQPAxJGXwDva_qWld70mx7UHC2FNe6gIa8fWYs2mjbrH0f7UBfGmLdmN2lnkx7oEcDCGRQt-L9k5_dHFw4YI4zQADNN43aax9Nzb88yHyGBJ4OqplZ2czqS0TH0xyMzp9NvDefmjW9RkyBU2gfgwaDnuoqVHMJODGbwvuMv8Y4Bm_ot5T-hlwde9ONKPqNsiBxVDA2ryFYOkSAh8VCY1YQscma_Olv39N-s4wg_MjWQrrLROQAF"/>
<!-- Animated Route Line SVG Overlay (Simulated) -->
<svg class="absolute inset-0 w-full h-full drop-shadow-[0_0_15px_rgba(227,30,36,0.6)]" preserveaspectratio="none" viewbox="0 0 1000 1000">
<path d="M 200 800 Q 300 600 500 550 T 800 300" fill="none" stroke="#e31e24" stroke-dasharray="1500" stroke-dashoffset="1500" stroke-linecap="round" stroke-linejoin="round" stroke-width="8">
<animate attributename="stroke-dashoffset" calcmode="ease-out" dur="3s" fill="freeze" values="1500;0"></animate>
</path>
<!-- Current Location Dot -->
<circle class="drop-shadow-[0_0_10px_rgba(227,30,36,0.8)]" cx="800" cy="300" fill="#e31e24" r="8"></circle>
</svg>
</div>
<!-- Gradient Vignette -->
<div class="fixed inset-0 z-10 map-overlay pointer-events-none"></div>
<!-- Top GPS Indicator Bar -->
<header class="fixed top-0 w-full z-30 px-container-padding py-stack-md flex justify-between items-start">
<div class="glass-panel rounded-full px-4 py-2 flex items-center gap-2">
<div class="relative w-3 h-3 flex items-center justify-center">
<div class="absolute inset-0 bg-tertiary rounded-full pulse-ring"></div>
<div class="w-2 h-2 bg-tertiary rounded-full z-10"></div>
</div>
<span class="font-label-caps text-label-caps text-on-surface tracking-widest uppercase">GPS Ready</span>
</div>
<!-- Signal Strength -->
<div class="glass-panel rounded-full p-2 flex items-center justify-center">
<span class="material-symbols-outlined text-tertiary" data-icon="signal_cellular_alt" style="font-variation-settings: 'FILL' 1;">signal_cellular_alt</span>
</div>
</header>
<!-- Bottom Tracking Dashboard (The Cockpit) -->
<div class="fixed bottom-0 w-full z-40 pb-8 px-4 sm:px-6">
<div class="glass-panel rounded-[32px] p-6 sm:p-8 flex flex-col gap-stack-lg max-w-2xl mx-auto backdrop-blur-2xl bg-surface-container-highest/60">
<!-- Primary Metric: Duration -->
<div class="text-center w-full">
<p class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-[0.1em] mb-1">Total Time</p>
<h1 class="font-display-italic text-[72px] leading-[72px] sm:text-[96px] sm:leading-[96px] text-on-surface italic tracking-tighter text-glow drop-shadow-md">
                    24:15
                </h1>
</div>
<!-- Secondary Metrics Grid -->
<div class="grid grid-cols-3 gap-4 divide-x divide-white/10 pt-2 pb-4 border-y border-white/5">
<div class="flex flex-col items-center justify-center">
<p class="font-label-caps text-[10px] sm:text-label-caps text-on-surface-variant uppercase mb-1">Distance</p>
<div class="flex items-baseline gap-1">
<span class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface italic">4.2</span>
<span class="font-body-md text-[12px] text-on-surface-variant">km</span>
</div>
</div>
<div class="flex flex-col items-center justify-center">
<p class="font-label-caps text-[10px] sm:text-label-caps text-on-surface-variant uppercase mb-1">Avg Pace</p>
<div class="flex items-baseline gap-1">
<span class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface italic">5'45"</span>
</div>
</div>
<div class="flex flex-col items-center justify-center">
<p class="font-label-caps text-[10px] sm:text-label-caps text-primary uppercase mb-1">Calories</p>
<div class="flex items-baseline gap-1">
<span class="font-headline-lg-mobile text-headline-lg-mobile text-primary italic">310</span>
<span class="font-body-md text-[12px] text-primary/70">kcal</span>
</div>
</div>
</div>
<!-- Action Controls -->
<div class="flex justify-center items-center gap-6 sm:gap-8 pt-2">
<!-- Pause Button -->
<button class="w-16 h-16 sm:w-20 sm:h-20 rounded-full glass-panel flex items-center justify-center hover:scale-105 active:scale-95 transition-transform duration-300 ease-out border border-white/20">
<span class="material-symbols-outlined text-[32px] text-on-surface" data-icon="pause" style="font-variation-settings: 'FILL' 1;">pause</span>
</button>
<!-- Stop Button (Primary Action) -->
<button class="w-20 h-20 sm:w-24 sm:h-24 rounded-full bg-gradient-to-b from-primary-container to-[#b3141a] shadow-[0_0_20px_rgba(227,30,36,0.5)] flex items-center justify-center hover:scale-105 active:scale-95 transition-transform duration-300 ease-out border border-white/10">
<span class="material-symbols-outlined text-[40px] text-white" data-icon="stop" style="font-variation-settings: 'FILL' 1;">stop</span>
</button>
<!-- Map Layer Toggle -->
<button class="w-16 h-16 sm:w-20 sm:h-20 rounded-full glass-panel flex items-center justify-center hover:scale-105 active:scale-95 transition-transform duration-300 ease-out border border-white/20">
<span class="material-symbols-outlined text-[28px] text-on-surface-variant" data-icon="layers">layers</span>
</button>
</div>
<!-- Pull Indicator -->
<div class="w-12 h-1 bg-white/20 rounded-full mx-auto mt-2"></div>
</div>
</div>
<!-- Note: TopAppBar and BottomNavBar are structurally suppressed per the Shell Visibility Mandate: This is a linear, focused task screen (Live Tracking), implying temporary departure from global nav. -->
</body></html>
