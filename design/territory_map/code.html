<!-- Immersive Map Background -->
<div class="absolute inset-0 z-0 bg-surface-container-lowest">

</div>
<!-- Top Status Bar: Countdown Chip -->
<div class="absolute top-12 left-1/2 -translate-x-1/2 z-20">
<div class="flex items-center space-x-2 bg-[rgba(46,46,48,0.7)] backdrop-blur-[20px] rounded-full px-5 py-2.5 border-t border-l border-white/20 shadow-[0px_10px_30px_rgba(0,0,0,0.15)]">
<span class="material-symbols-outlined text-primary text-[18px]">timelapse</span>
<span class="font-label-caps text-label-caps text-on-surface uppercase tracking-widest">Reset in 2d 14h</span>
</div>
</div>
<!-- Main Content Canvas (Floating Stats Card) -->
<main class="absolute bottom-[112px] left-0 w-full px-container-padding z-10 flex flex-col items-center">
<!-- Kinetic Floating Element -->
<div class="w-full max-w-md bg-[rgba(46,46,48,0.7)] backdrop-blur-[20px] rounded-[24px] p-6 border-t border-l border-white/20 shadow-[0px_10px_30px_rgba(0,0,0,0.3)] relative overflow-hidden">
<!-- Atmospheric inner glow -->
<div class="absolute -top-10 -right-10 w-32 h-32 bg-primary-container/20 rounded-full blur-[40px] pointer-events-none"></div>
<div class="flex flex-col gap-stack-lg relative z-10">
<!-- Header Group -->
<div class="flex justify-between items-start">
<h2 class="font-label-caps text-label-caps text-on-surface-variant uppercase">Your area this week</h2>
<!-- Territory Indicator Chip -->
<div class="flex items-center space-x-1.5 bg-primary-container/10 px-2.5 py-1 rounded-full border border-primary-container/30">
<span class="w-2 h-2 rounded-full bg-primary-container shadow-[0_0_8px_rgba(227,30,36,0.8)] animate-pulse"></span>
<span class="font-label-caps text-label-caps text-primary uppercase">Active Zone</span>
</div>
</div>
<!-- Primary Data Point (Rank) -->
<div class="flex items-baseline space-x-3 -mt-2">
<span class="font-display-italic text-display-italic text-primary italic vibrant-glow tracking-tighter">#4</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface italic">Dominator</span>
</div>
<!-- Call to Action / Hint -->
<div class="flex items-center justify-between border-t border-white/10 pt-4">
<div class="flex items-center space-x-2 text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">directions_run</span>
<span class="font-body-md text-body-md">Claim more by running</span>
</div>
<!-- Signature Primary Button -->
<button class="spring-tap bg-primary-container text-on-primary-container font-label-caps text-label-caps uppercase px-5 py-2.5 rounded-full shadow-[inset_0_2px_4px_rgba(255,255,255,0.4)] flex items-center space-x-1">
<span>Deploy</span>
<span class="material-symbols-outlined text-[16px]">chevron_right</span>
</button>
</div>
</div>
</div>
