# Codemagic CI/CD configuration for FitBox.
#
# iOS is built, signed and shipped entirely here (no local Mac/Xcode). Android
# builds run here too for parity and release artifacts.
#
# All secrets are supplied through Codemagic environment variable groups in the
# Codemagic UI — nothing sensitive is committed to the repository.
#
# Required environment variable groups / variables (create these in Codemagic):
#
#   Group "appstore_credentials" (for iOS code signing & TestFlight):
#     APP_STORE_CONNECT_PRIVATE_KEY      # contents of the App Store Connect .p8 key
#     APP_STORE_CONNECT_KEY_IDENTIFIER   # App Store Connect API key ID
#     APP_STORE_CONNECT_ISSUER_ID        # App Store Connect issuer ID
#     CERTIFICATE_PRIVATE_KEY            # PEM private key used to fetch/generate the signing cert
#
#   Group "google_play_credentials" (for Android release signing & Play upload):
#     CM_KEYSTORE                        # base64-encoded upload keystore (.jks)
#     CM_KEYSTORE_PASSWORD
#     CM_KEY_ALIAS
#     CM_KEY_PASSWORD
#     GCLOUD_SERVICE_ACCOUNT_CREDENTIALS # Play Developer API service-account JSON
#
# The App Store Connect integration is configured under
# Codemagic UI → Teams/App settings → Integrations → App Store Connect.

definitions:
  flutter_setup: &flutter_setup
    flutter: stable
    xcode: latest
    cocoapods: default

workflows:
  ios-testflight:
    name: iOS — build & TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      <<: *flutter_setup
      groups:
        - appstore_credentials
      vars:
        BUNDLE_ID: "com.fitboxsports.app"
        APP_STORE_APPLE_ID: "0000000000" # TODO: set the numeric App Store Connect app ID
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test
      - name: Set up code signing
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-release:
    name: Android — build App Bundle
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      <<: *flutter_setup
      groups:
        - google_play_credentials
      vars:
        PACKAGE_NAME: "com.fitboxsports.app"
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test
      - name: Set up release keystore
        script: |
          echo "$CM_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/upload-keystore.jks"
          cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_BUILD_DIR/upload-keystore.jks
          EOF
      - name: Build App Bundle
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/**/mapping.txt
    # publishing.google_play is intentionally left out until the Play Developer
    # API service account and signing are provisioned. Enable it with:
    #   google_play:
    #     credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
    #     track: internal
