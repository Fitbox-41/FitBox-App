# Codemagic CI/CD configuration for FitBox.
#
# iOS is built, signed and shipped entirely here (no local Mac/Xcode). Android
# builds run here too for parity and release artifacts.
#
# All secrets are supplied through Codemagic environment variable groups in the
# Codemagic UI — nothing sensitive is committed to the repository.
#
# Required environment variable groups / variables (create these in Codemagic):
#
#   Group "appstore_credentials" (for iOS code signing & TestFlight):
#     APP_STORE_CONNECT_PRIVATE_KEY      # contents of the App Store Connect .p8 key
#     APP_STORE_CONNECT_KEY_IDENTIFIER   # App Store Connect API key ID
#     APP_STORE_CONNECT_ISSUER_ID        # App Store Connect issuer ID
#     CERTIFICATE_PRIVATE_KEY            # PEM private key used to fetch/generate the signing cert
#
#   Group "google_play_credentials" (for Android release signing & Play upload):
#     CM_KEYSTORE                        # base64-encoded upload keystore (.jks)
#     CM_KEYSTORE_PASSWORD
#     CM_KEY_ALIAS
#     CM_KEY_PASSWORD
#     GCLOUD_SERVICE_ACCOUNT_CREDENTIALS # Play Developer API service-account JSON
#
#   Group "firebase_and_maps" (BOTH platforms — the build fails without these,
#   because all four files are gitignored and therefore absent on a fresh clone):
#     GOOGLE_SERVICES_JSON               # base64 of android/app/google-services.json
#     GOOGLE_SERVICE_INFO_PLIST          # base64 of ios/Runner/GoogleService-Info.plist
#     MAPS_API_KEY_ANDROID               # Maps key restricted to the Android app
#     MAPS_API_KEY_IOS                   # Maps key restricted to the iOS bundle id
#
#   Two separate Maps keys are required. A Google Maps key takes exactly ONE
#   application restriction — "Android apps" OR "iOS apps" — so a key locked to
#   the Android package is rejected on iOS, and vice versa.
#
#   To produce the base64 values (macOS/Linux):  base64 -i <file> | pbcopy
#   On Windows PowerShell:
#     [Convert]::ToBase64String([IO.File]::ReadAllBytes("path\to\file")) | Set-Clipboard
#
# The App Store Connect integration is configured under
# Codemagic UI → Teams/App settings → Integrations → App Store Connect.

definitions:
  flutter_setup: &flutter_setup
    # Pinned, not `stable`. With `stable` the CI silently follows whatever
    # Flutter released most recently, so a build that passed yesterday can fail
    # today for reasons unrelated to the code — which is exactly what happened:
    # a newer Flutter raised the iOS deployment floor and CocoaPods refused to
    # resolve. Keep this in step with the Flutter version used locally
    # (`flutter --version`) and raise it deliberately.
    flutter: 3.44.1
    xcode: latest
    cocoapods: default

workflows:
  # ---------------------------------------------------------------------------
  # Start here. This workflow needs NO Apple Developer account — it compiles the
  # iOS app without signing, which is exactly the step that cannot be tested on
  # Windows: CocoaPods resolving, the deployment target being high enough, and
  # the native code actually building.
  #
  # It only needs the "firebase_and_maps" variable group. Run it as soon as the
  # repository is connected; fix anything it finds now rather than on the day the
  # Apple account arrives.
  # ---------------------------------------------------------------------------
  ios-validate:
    name: iOS — compile check (no signing, no Apple account)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      <<: *flutter_setup
      groups:
        - firebase_and_maps
    scripts:
      - name: Restore gitignored config
        script: |
          set -e
          # Fail loudly if the variable group is missing or a value is empty.
          # Without this the build still "succeeds": an empty value decodes to an
          # empty plist and an empty Maps key, both of which only break at
          # runtime — so a green build would wrongly suggest the config was fine.
          : "${GOOGLE_SERVICE_INFO_PLIST:?missing — add it to the 'firebase_and_maps' variable group in Codemagic (base64 of ios/Runner/GoogleService-Info.plist)}"
          : "${MAPS_API_KEY_IOS:?missing — add the iOS-restricted Maps key to the 'firebase_and_maps' variable group}"

          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist
          # A truncated or non-base64 value decodes to something unusable; check
          # the result actually looks like the plist we expect.
          grep -q "API_KEY\|GOOGLE_APP_ID" ios/Runner/GoogleService-Info.plist \
            || { echo "GoogleService-Info.plist did not decode to a valid plist — check the base64 value"; exit 1; }

          echo "MAPS_API_KEY=$MAPS_API_KEY_IOS" >> ios/Flutter/Release.xcconfig
          echo "MAPS_API_KEY=$MAPS_API_KEY_IOS" >> ios/Flutter/Debug.xcconfig
          echo "Config restored: plist $(wc -c < ios/Runner/GoogleService-Info.plist) bytes, Maps key ${#MAPS_API_KEY_IOS} chars"
      - name: Get Flutter packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test
      - name: Install pods
        script: |
          # The first real test of ios/Podfile and the iOS 15.0 deployment
          # target. If a plugin needs a higher floor, it fails loudly here.
          cd ios && pod install --repo-update
      - name: Build unsigned iOS app
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log

  ios-testflight:
    name: iOS — build & TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      <<: *flutter_setup
      groups:
        - appstore_credentials
        - firebase_and_maps
      vars:
        BUNDLE_ID: "com.fitboxsports.app"
        APP_STORE_APPLE_ID: "0000000000" # TODO: set the numeric App Store Connect app ID
    scripts:
      - name: Restore gitignored config
        script: |
          set -e
          : "${GOOGLE_SERVICE_INFO_PLIST:?missing — add it to the 'firebase_and_maps' variable group in Codemagic}"
          : "${MAPS_API_KEY_IOS:?missing — add the iOS-restricted Maps key to the 'firebase_and_maps' variable group}"
          # Firebase config for iOS — absent from the repo by design.
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist
          grep -q "API_KEY\|GOOGLE_APP_ID" ios/Runner/GoogleService-Info.plist \
            || { echo "GoogleService-Info.plist did not decode to a valid plist"; exit 1; }
          # Info.plist reads GMSApiKey from $(MAPS_API_KEY); supply it as an Xcode
          # build setting. Must be the iOS-restricted key, not the Android one.
          echo "MAPS_API_KEY=$MAPS_API_KEY_IOS" >> ios/Flutter/Release.xcconfig
          echo "MAPS_API_KEY=$MAPS_API_KEY_IOS" >> ios/Flutter/Debug.xcconfig
      - name: Get Flutter packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test
      - name: Set up code signing
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    # Publishing to TestFlight is commented out until there is an Apple
    # Developer account.
    #
    # `auth: integration` refers to an App Store Connect integration configured
    # in the Codemagic UI, and Codemagic rejects the WHOLE file if that
    # reference can't be resolved — which also blocks ios-validate from running.
    # So this stays off until the integration exists.
    #
    # To turn it on, once the Apple account and integration are set up:
    #   1. Codemagic → Teams/App settings → Integrations → App Store Connect,
    #      connect it and note the integration name.
    #   2. Add the integration to this workflow's environment:
    #        environment:
    #          integrations:
    #            app_store_connect: <the integration name>
    #   3. Uncomment the block below.
    #
    # publishing:
    #   app_store_connect:
    #     auth: integration
    #     submit_to_testflight: true

  android-release:
    name: Android — build App Bundle
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      <<: *flutter_setup
      groups:
        - google_play_credentials
        - firebase_and_maps
      vars:
        PACKAGE_NAME: "com.fitboxsports.app"
    scripts:
      - name: Restore gitignored config
        script: |
          set -e
          : "${GOOGLE_SERVICES_JSON:?missing — add it to the 'firebase_and_maps' variable group in Codemagic (base64 of android/app/google-services.json)}"
          : "${MAPS_API_KEY_ANDROID:?missing — add the Android-restricted Maps key to the 'firebase_and_maps' variable group}"
          # The google-services Gradle plugin fails the build without this file,
          # and it is deliberately not committed.
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
          grep -q "project_id" android/app/google-services.json \
            || { echo "google-services.json did not decode to valid JSON — check the base64 value"; exit 1; }
          # AndroidManifest reads ${MAPS_API_KEY} from local.properties.
          echo "MAPS_API_KEY=$MAPS_API_KEY_ANDROID" >> android/local.properties
      - name: Get Flutter packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test
      - name: Set up release keystore
        script: |
          echo "$CM_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/upload-keystore.jks"
          cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_BUILD_DIR/upload-keystore.jks
          EOF
      - name: Build App Bundle
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/**/mapping.txt
    # publishing.google_play is intentionally left out until the Play Developer
    # API service account and signing are provisioned. Enable it with:
    #   google_play:
    #     credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
    #     track: internal
